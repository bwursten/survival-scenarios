<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lost Patrol: A Survival Scenario</title>

<!--
  ============================================================================
  LOST PATROL — interactive survival scenario
  Single self-contained file. No cookies, no tracking, no browser storage.
  One external request only: Google Fonts (Alfa Slab One + Source Sans 3).
  To remove even that, delete the two <link> tags below; the system-font
  fallbacks in the CSS take over automatically.

  ADDING ILLUSTRATIONS: search for `art:` — every scene has a slot.
  Add a `src` and `alt` and that scene renders the image instead of the
  placeholder box. See EMBED-INSTRUCTIONS.md.

  ADDING AN ILLUSTRATED TRAIL MAP: see MAP_BACKGROUND near the top of the
  script. Point it at an image and the drawn terrain hides, leaving the
  pins and trail lines on top of your artwork.
  ============================================================================
-->

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Source+Sans+3:wght@400;600;700;900&display=swap" rel="stylesheet">

<style>
  :root{
    /* --- national park poster palette --- */
    --orange:#E8552A;
    --orange-dk:#C43F1B;
    --gold:#F2A93B;
    --gold-lt:#FCE3B0;
    --teal:#1F9C9C;
    --teal-lt:#D3EDEC;
    --teal-dk:#12706F;
    --pine:#14503C;
    --pine-lt:#DCEBE0;
    --moss:#4C8A5B;
    --cream:#FFF8EC;
    --paper:#FFFDF7;
    --ink:#22221E;
    --ink-soft:#6A6558;
    --line:#E4D9C2;
    --line-dk:#CDBE9C;
    --sky:#7CC5D8;

    --radius:16px;
    --pad:clamp(16px, 4vw, 30px);
    --fs:16.5px;

    --display:"Alfa Slab One", Rockwell, "Roboto Slab", Georgia, serif;
    --body:"Source Sans 3", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:var(--body);
    font-size:var(--fs);
    line-height:1.6;
    color:var(--ink);
    background:
      radial-gradient(circle at 12% -8%, rgba(242,169,59,.20), transparent 42%),
      radial-gradient(circle at 92% 4%, rgba(31,156,156,.16), transparent 38%),
      var(--cream);
    -webkit-text-size-adjust:100%;
  }
  body.meeting{--fs:23px}
  #app{max-width:820px;margin:0 auto;padding:var(--pad)}
  body.meeting #app{max-width:1180px}

  /* ================= shared ================= */
  h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.12;margin:0 0 .5em;letter-spacing:.01em}
  h1{font-size:2.1em}
  h2{font-size:1.55em}
  h3{font-size:1.1em}
  p{margin:0 0 1em}
  .kicker{
    font-size:.72em;letter-spacing:.16em;text-transform:uppercase;
    font-weight:900;color:var(--teal-dk);margin:0 0 .55em;
  }
  .card{
    background:var(--paper);border:2px solid var(--line);border-radius:var(--radius);
    padding:var(--pad);box-shadow:0 3px 0 var(--line), 0 10px 24px rgba(34,34,30,.06);
  }
  .btn{
    font:inherit;font-family:var(--body);font-weight:700;cursor:pointer;
    border-radius:12px;border:2px solid transparent;padding:.7em 1.3em;
    transition:transform .08s ease, background .15s ease, box-shadow .15s ease;
  }
  .btn:active{transform:translateY(2px)}
  .btn-primary{background:var(--orange);color:#fff;box-shadow:0 3px 0 var(--orange-dk)}
  .btn-primary:hover{background:#f06034}
  .btn-primary:active{box-shadow:0 1px 0 var(--orange-dk)}
  .btn-ghost{background:var(--paper);color:var(--ink-soft);border-color:var(--line-dk)}
  .btn-ghost:hover{background:var(--gold-lt);color:var(--ink)}
  .btn-sm{font-size:.85em;padding:.5em 1em}
  :focus-visible{outline:3px solid var(--teal);outline-offset:3px}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  .icon{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}

  /* ================= top bar ================= */
  .topbar{display:flex;align-items:center;gap:.75em;flex-wrap:wrap;margin-bottom:1.1em}
  .brand{
    font-family:var(--display);font-size:1.15em;margin-right:auto;color:var(--pine);
    display:inline-flex;align-items:center;gap:.5em;
  }
  .brand .blaze{
    width:1.1em;height:1.1em;border-radius:4px;background:var(--orange);
    display:inline-block;transform:rotate(45deg);
  }
  .mode-toggle{
    font:inherit;font-size:.82em;font-weight:700;cursor:pointer;
    background:var(--paper);border:2px solid var(--line-dk);border-radius:999px;
    padding:.42em 1em;color:var(--ink-soft);display:inline-flex;align-items:center;gap:.5em;
  }
  .mode-toggle[aria-pressed="true"]{background:var(--teal);color:#fff;border-color:var(--teal-dk)}
  .mode-toggle .icon{width:1.05em;height:1.05em}

  /* ================= STOP screen ================= */
  .stop-hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:var(--pad);align-items:center}
  @media (max-width:640px){ .stop-hero{grid-template-columns:1fr} }
  .sign-wrap{display:grid;place-items:center;gap:.9em}
  .stop-sign{width:min(74%,240px);height:auto;filter:drop-shadow(0 6px 0 rgba(0,0,0,.16))}
  .sign-caption{font-size:.8em;font-weight:700;color:var(--ink-soft);text-align:center;max-width:20em}
  .stop-steps{list-style:none;margin:1.4em 0 0;padding:0;display:grid;gap:.7em}
  .stop-step{
    display:flex;gap:.85em;align-items:flex-start;
    background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:.75em .9em;
  }
  .stop-step .glyph{
    flex:none;width:2.1em;height:2.1em;border-radius:9px;display:grid;place-items:center;
    font-family:var(--display);font-size:1.05em;color:#fff;
  }
  .stop-step:nth-child(1) .glyph{background:var(--orange)}
  .stop-step:nth-child(2) .glyph{background:var(--gold)}
  .stop-step:nth-child(3) .glyph{background:var(--teal)}
  .stop-step:nth-child(4) .glyph{background:var(--pine)}
  .stop-step .word{font-family:var(--display);font-size:1.02em;display:block;line-height:1.2}
  .stop-step .say{font-size:.92em;color:var(--ink-soft)}
  .pick-line{font-family:var(--display);font-size:1.18em;line-height:1.25;margin:1.4em 0 .8em}

  /* ================= status panel ================= */
  .status{
    background:var(--paper);border:2px solid var(--line);border-radius:var(--radius);
    padding:.9em;margin-bottom:1.1em;box-shadow:0 3px 0 var(--line);
  }
  .status-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.6em}
  .tile{
    border:2px solid var(--line);border-radius:12px;background:#fff;
    padding:.6em .7em;display:flex;flex-direction:column;gap:.25em;min-width:0;
  }
  .tile .t-label{font-size:.63em;letter-spacing:.12em;text-transform:uppercase;font-weight:900;color:var(--ink-soft)}
  .tile .t-value{font-size:.88em;font-weight:700;line-height:1.2}
  .tile .t-row{display:flex;align-items:center;gap:.45em}
  .tile .icon{width:1.45em;height:1.45em;stroke-width:1.8}
  .tile.off{background:#F6F2E8;border-color:var(--line);color:#9A9384}
  .tile.off .t-value{color:#9A9384}
  .tile.on{border-color:var(--moss);background:var(--pine-lt);color:var(--pine)}
  .tile.warn{border-color:var(--gold);background:var(--gold-lt);color:#7C550D}
  .tile.alert{border-color:var(--orange);background:#FDE6DE;color:var(--orange-dk)}
  .tile-day{grid-column:span 2;flex-direction:row;align-items:center;gap:.85em}
  .tile-day .t-block{flex:none}
  .tile-day .t-value{font-size:1.15em;font-family:var(--display);font-weight:400}
  .sunarc{flex:1;min-width:0;max-width:220px;height:auto;display:block;border-radius:8px;overflow:hidden}
  .morale-bars{display:flex;gap:3px;align-items:flex-end;height:1.3em}
  .morale-bars span{width:.42em;border-radius:2px;background:currentColor;opacity:.22}
  .morale-bars span.lit{opacity:1}
  .morale-bars span:nth-child(1){height:40%}
  .morale-bars span:nth-child(2){height:60%}
  .morale-bars span:nth-child(3){height:80%}
  .morale-bars span:nth-child(4){height:100%}
  @media (max-width:620px){
    .status{padding:.6em}
    .status-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:.4em}
    .tile{padding:.45em .4em;align-items:center;text-align:center;gap:.15em}
    .tile .t-row{flex-direction:column;gap:.15em}
    .tile .t-label{font-size:.58em;letter-spacing:.06em}
    .tile .t-value{font-size:.72em}
    .tile-day{grid-column:span 3;align-items:center;text-align:left;gap:.6em}
    .tile-day .t-row{flex-direction:row}
    .sunarc{max-width:170px}
  }

  /* ================= breadcrumb ================= */
  .breadcrumb{font-size:.78em;color:var(--ink-soft);margin-bottom:.8em;font-weight:600}
  .breadcrumb ol{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:.3em .5em}
  .breadcrumb li{background:var(--gold-lt);border-radius:999px;padding:.15em .7em}

  /* ================= scene ================= */
  .scene{animation:rise .3s ease both}
  @keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){ .scene{animation:none} * {transition:none !important} }
  .scene .body{font-size:1.04em}
  .scene .body p:last-child{margin-bottom:0}
  .prompt{
    font-family:var(--display);font-size:1.22em;line-height:1.2;
    margin:1.3em 0 .8em;padding-top:1em;border-top:3px dotted var(--line-dk);
  }
  .choices{display:grid;gap:.7em}
  .choice{
    display:flex;gap:.9em;align-items:flex-start;text-align:left;width:100%;
    font:inherit;cursor:pointer;background:#fff;color:var(--ink);
    border:2px solid var(--line-dk);border-radius:14px;padding:1em 1.1em;
    box-shadow:0 3px 0 var(--line);
    transition:border-color .15s, background .15s, transform .08s, box-shadow .15s;
  }
  .choice:hover{border-color:var(--teal);background:var(--teal-lt)}
  .choice:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
  .choice .key{
    flex:none;width:2em;height:2em;border-radius:9px;display:grid;place-items:center;
    background:var(--teal);color:#fff;font-family:var(--display);font-size:.9em;
  }
  body.meeting .choice .key{width:2.3em;height:2.3em;font-size:1.05em}
  .choice .cost{display:flex;align-items:center;gap:.35em;font-size:.78em;color:var(--ink-soft);margin-top:.4em;font-weight:700}
  .choice .cost .icon{width:1.05em;height:1.05em}

  /* ================= consequence / tip / facilitator ================= */
  .consequence{
    border:2px solid var(--orange);border-left-width:8px;background:#FDE6DE;
    border-radius:12px;padding:.85em 1.05em;margin:0 0 1.2em;
  }
  .consequence.neutral{border-color:var(--teal);background:var(--teal-lt)}
  .consequence .kicker{color:var(--orange-dk)}
  .consequence.neutral .kicker{color:var(--teal-dk)}
  .consequence p:last-child{margin-bottom:0}
  .tip{
    border:2px solid var(--gold);background:var(--gold-lt);border-left-width:8px;
    border-radius:12px;padding:.95em 1.1em;margin:1.3em 0 0;
  }
  .tip .kicker{color:#8A5B0C;display:flex;align-items:center;gap:.45em}
  .tip .kicker .icon{width:1.3em;height:1.3em}
  .tip p:last-child{margin-bottom:0}
  .facilitator{display:none}
  body.meeting .facilitator{
    display:block;border:3px dashed var(--teal);border-radius:14px;
    padding:1em 1.1em;margin-top:1.2em;background:var(--teal-lt);
  }
  .facilitator .kicker{color:var(--teal-dk)}
  .facilitator ul{margin:0;padding-left:1.2em}
  .facilitator li{margin-bottom:.4em}
  .facilitator li:last-child{margin-bottom:0}

  /* ================= ending ================= */
  .outcome-badge{
    display:inline-flex;align-items:center;gap:.5em;
    font-size:.76em;font-weight:900;letter-spacing:.1em;text-transform:uppercase;
    border-radius:999px;padding:.45em 1.05em;margin-bottom:.85em;border:2px solid;
  }
  .outcome-badge .icon{width:1.25em;height:1.25em}
  .outcome-badge.good{background:var(--pine-lt);color:var(--pine);border-color:var(--moss)}
  .outcome-badge.rough{background:var(--gold-lt);color:#7C550D;border-color:var(--gold)}
  .outcome-badge.bad{background:#FDE6DE;color:var(--orange-dk);border-color:var(--orange)}
  .light-note{font-size:.87em;color:var(--ink-soft);font-weight:700;margin:-.3em 0 1em;display:flex;align-items:center;gap:.4em}
  .light-note .icon{width:1.2em;height:1.2em}

  /* ================= trail map ================= */
  .map-card{margin-top:1.3em;padding-bottom:calc(var(--pad) * .7)}
  .map-intro{font-size:.93em;color:var(--ink-soft)}
  .map-frame{
    position:relative;border:2px solid var(--line-dk);border-radius:14px;overflow:hidden;
    background:#F3EAD5;margin:.9em 0 0;
  }
  .map-frame img.map-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .map-svg{display:block;width:100%;height:auto;position:relative}
  .pin{cursor:pointer}
  .pin:focus{outline:none}
  .pin .hit{fill:transparent}
  .pin .halo{fill:none;stroke:var(--gold);stroke-width:4;opacity:0}
  .pin.taken .halo{opacity:1}
  .pin:hover .halo,.pin:focus .halo,.pin.active .halo{opacity:1;stroke:var(--teal-dk);stroke-width:5}
  .pin .body-shape{stroke:#fff;stroke-width:3}
  .pin .num{font-family:var(--display);font-size:19px;fill:#fff;text-anchor:middle;dominant-baseline:central}
  .pin-label{font-family:var(--body);font-weight:700;font-size:15px;fill:#4A4436}
  .pin.taken .pin-label{fill:var(--ink);font-weight:900}
  .edge{fill:none;stroke:#B7A98B;stroke-width:3;stroke-dasharray:2 7;stroke-linecap:round}
  .edge.taken{stroke:var(--gold);stroke-width:7;stroke-dasharray:none;filter:drop-shadow(0 2px 0 rgba(196,63,27,.25))}
  .terrain-tree{fill:#8FB894}
  .terrain-tree.dark{fill:#5E9070}
  .terrain-trunk{fill:#A6825A}
  .river{fill:none;stroke:#8FD0DC;stroke-width:16;stroke-linecap:round;opacity:.85}
  .river-2{fill:none;stroke:#C6E9F0;stroke-width:7;stroke-linecap:round}
  .ridge{fill:#CFC0A0}
  .ridge-2{fill:#BCA98A}
  .map-title{font-family:var(--display);font-size:26px;fill:#8C7B58}
  .map-sub{font-family:var(--body);font-weight:700;font-size:14px;fill:#A2937A;letter-spacing:.14em}
  .legend-txt{font-family:var(--body);font-weight:700;font-size:14px;fill:#5C543F}
  .map-hint{font-size:.83em;color:var(--ink-soft);margin:.7em 0 0;display:flex;align-items:center;gap:.4em;font-weight:600}
  .map-hint .icon{width:1.15em;height:1.15em}

  .map-detail{
    margin-top:.9em;border:2px solid var(--line-dk);border-radius:14px;
    padding:1em 1.1em;background:var(--paper);min-height:8.5em;
  }
  .map-detail .md-head{display:flex;align-items:center;gap:.6em;flex-wrap:wrap;margin-bottom:.5em}
  .map-detail h3{margin:0;font-size:1.15em}
  .map-detail .md-lesson{font-size:.95em;margin:0 0 .8em}
  .map-detail .md-empty{color:var(--ink-soft);font-size:.95em;margin:0}
  .md-tag{
    font-size:.68em;font-weight:900;letter-spacing:.1em;text-transform:uppercase;
    border-radius:999px;padding:.3em .8em;border:2px solid;
  }
  .md-tag.good{background:var(--pine-lt);color:var(--pine);border-color:var(--moss)}
  .md-tag.rough{background:var(--gold-lt);color:#7C550D;border-color:var(--gold)}
  .md-tag.bad{background:#FDE6DE;color:var(--orange-dk);border-color:var(--orange)}
  .md-tag.step{background:var(--teal-lt);color:var(--teal-dk);border-color:var(--teal)}
  .md-tag.yours{background:var(--gold);color:#3D2A05;border-color:var(--gold)}

  /* ================= controls / art ================= */
  .controls{display:flex;gap:.6em;flex-wrap:wrap;margin-top:1.4em}
  .art{margin:0 0 1.2em}
  .art img{width:100%;height:auto;display:block;border-radius:12px;border:2px solid var(--line)}
  .art figcaption{font-size:.78em;color:var(--ink-soft);margin-top:.4em}
  .art-box{
    border:3px dashed var(--line-dk);border-radius:12px;
    background:repeating-linear-gradient(45deg,#FAF3E4,#FAF3E4 12px,#F5ECD9 12px,#F5ECD9 24px);
    aspect-ratio:16/7;display:grid;place-content:center;text-align:center;gap:.4em;padding:1em;
  }
  .art-box .art-label{font-size:.7em;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--teal-dk)}
  .art-box .art-note{font-size:.86em;color:var(--ink-soft);max-width:34em}
  .art-box .icon{width:2em;height:2em;color:var(--line-dk);margin:0 auto;stroke-width:1.5}
</style>
</head>
<body>

  function freshState(){

      daylight: TOTAL_DAYLIGHT,

      visited: [ROOT],
      cond: { split:false, wet:false, injured:false, fire:false, shelter:false, signal:false, night:false, morale:0 }

  function snapshot(){ return JSON.stringify(state); }

  var stage = document.getElementById('stage');

  function el(tag, cls, txt){
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (txt !== undefined && txt !== null) n.textContent = txt;
    return n;
  }
  function icon(id, cls){
    var s = document.createElementNS(SVGNS,'svg');
    s.setAttribute('class', 'icon' + (cls ? ' ' + cls : ''));
    s.setAttribute('aria-hidden','true');
    s.setAttribute('focusable','false');
    var u = document.createElementNS(SVGNS,'use');
    u.setAttribute('href','#' + id);
    s.appendChild(u);
    return s;
  }
  function sv(tag, attrs){
    var n = document.createElementNS(SVGNS, tag);
    if (attrs) Object.keys(attrs).forEach(function(k){ n.setAttribute(k, attrs[k]); });
    return n;
  }
  function svText(x, y, str, cls, anchor){
    var t = sv('text', { x:x, y:y, class:cls });
    if (anchor) t.setAttribute('text-anchor', anchor);
    t.textContent = str;
    return t;
  }
  function formatTime(mins){
    if (mins <= 0) return 'None';
    var h = Math.floor(mins/60), m = mins % 60;
    if (h && m) return h + 'h ' + m + 'm';
    if (h) return h + 'h';
    return m + 'm';
  }
  function paragraphs(arr){
    var wrap = el('div','body');
    (arr || []).forEach(function(p){ wrap.appendChild(el('p', null, p)); });
    return wrap;
  }
  function artBlock(art){
    if (!art) return null;
    var fig = el('figure','art');
    if (art.src){
      var img = document.createElement('img');
      img.src = art.src;
      img.alt = art.alt || '';
      fig.appendChild(img);
      if (art.credit) fig.appendChild(el('figcaption', null, art.credit));
      return fig;
    }
    if (!SHOW_ART_PLACEHOLDERS) return null;
    var box = el('div','art-box');
    box.setAttribute('data-slot', art.slot || '');
    box.appendChild(icon('i-image'));
    box.appendChild(el('span','art-label','Illustration slot: ' + (art.slot || 'unnamed')));
    if (art.note) box.appendChild(el('span','art-note', art.note));
    fig.appendChild(box);
    return fig;
  }
  function applyEffects(fx){
    if (!fx) return;
    Object.keys(fx).forEach(function(k){
      if (k === 'morale'){ state.cond.morale += fx[k]; return; }
      if (k === 'dry'){ state.cond.wet = false; return; }
      state.cond[k] = fx[k];
    });
  }

  /* =========================================================================
     GRAPH UTILITIES
     ====================================================================== */
  var PARENT = {};   // childId -> {id, choice}
  var DEPTH  = {};
  (function indexGraph(){
    (function walk(id, depth){
      DEPTH[id] = depth;
      (STORY[id].choices || []).forEach(function(c){
        PARENT[c.to] = { id:id, choice:c };
        walk(c.to, depth + 1);
      });
    })(ROOT, 0);
  })();

  function routeTo(id){                    // list of choices from ROOT to id
    var chain = [], cur = id;
    while (PARENT[cur]){ chain.unshift(PARENT[cur].choice); cur = PARENT[cur].id; }
    return chain;
  }
  function playTo(id){                     // rebuild state by replaying choices
    state = freshState();
    undoStack = [];
    routeTo(id).forEach(function(ch){ applyChoice(ch); });
  }
  function applyChoice(ch){
    undoStack.push(snapshot());
    state.trail.push(ch.short || ch.label);
    state.daylight = Math.max(0, state.daylight - (ch.time || 0));
    applyEffects(ch.effects);
    state.node = ch.to;
    var node = STORY[state.node];
    if (node.time !== undefined) state.daylight = Math.max(0, state.daylight - node.time);
    applyEffects(node.effects);
    if (state.visited.indexOf(state.node) === -1) state.visited.push(state.node);
  }

  /* =========================================================================

     ====================================================================== */
  function tile(opts){
    var t = el('div','tile tile-' + opts.key + ' ' + (opts.tone || 'off'));
    var block = el('div','t-block');
    block.appendChild(el('span','t-label', opts.label));
    var row = el('div','t-row');
    if (opts.icon) [].concat(opts.icon).forEach(function(i){ row.appendChild(icon(i)); });
    if (opts.custom) row.appendChild(opts.custom);
    row.appendChild(el('span','t-value', opts.value));
    block.appendChild(row);
    t.appendChild(block);
    if (opts.extra) t.appendChild(opts.extra);
    return t;
  }

  function sunArc(){
    var frac = Math.max(0, Math.min(1, state.daylight / TOTAL_DAYLIGHT));
    var dark = state.daylight <= 0 || state.cond.night;
    var t = dark ? 1 : (1 - frac);
    var deg = 30 + t * 150, rad = deg * Math.PI / 180;
    var cx = 60, cy = 54, r = 42;
    var sx = cx - r * Math.cos(rad), sy = cy - r * Math.sin(rad);

    var svg = sv('svg', { class:'sunarc', viewBox:'0 0 120 60', role:'img' });
    svg.appendChild(sv('title', {})).textContent = dark ? 'The sun has set' : formatTime(state.daylight) + ' of daylight left';

    var grad = sv('linearGradient', { id:'skyGrad', x1:'0', y1:'0', x2:'0', y2:'1' });
    var stops = dark ? ['#20304F','#3D4E70']
              : t < .34 ? ['#8FD3E8','#CFEAF2']
              : t < .7  ? ['#9FC6DE','#F6D9A6']
              :           ['#D98A57','#F3C489'];
    grad.appendChild(sv('stop', { offset:'0%', 'stop-color':stops[0] }));
    grad.appendChild(sv('stop', { offset:'100%', 'stop-color':stops[1] }));
    var defs = sv('defs'); defs.appendChild(grad); svg.appendChild(defs);

    svg.appendChild(sv('rect', { x:0, y:0, width:120, height:60, fill:'url(#skyGrad)' }));
    svg.appendChild(sv('path', {
      d:'M ' + (cx - r) + ' ' + cy + ' A ' + r + ' ' + r + ' 0 0 1 ' + (cx + r) + ' ' + cy,
      fill:'none', stroke:'rgba(255,255,255,.55)', 'stroke-width':1.5, 'stroke-dasharray':'3 4'

  function statusPanel(){
    var wrap = el('section','status');
    wrap.setAttribute('aria-label','Patrol status');

    var c = state.cond;
    var dark = state.daylight <= 0 || c.night;
    var isEnd = !!STORY[state.node].ending;

    grid.appendChild(tile({
      key:'day', label: isEnd ? (dark ? 'Ran out of light' : 'Light left when you stopped') : (dark ? 'After dark' : 'Daylight left'),
      value: dark ? 'Dark' : formatTime(state.daylight),
      icon:'i-sun', tone: dark ? 'alert' : state.daylight <= 45 ? 'warn' : 'on',
      extra: sunArc()
    }));

    var who = [c.split ? 'Split up' : 'Together'];
    if (c.injured) who.push('1 hurt');
    grid.appendChild(tile({
      key:'group', label:'Patrol', value: who.join(', '),
      icon: c.injured ? [c.split ? 'i-split' : 'i-group', 'i-bandage'] : (c.split ? 'i-split' : 'i-group'),
      tone: (c.split || c.injured) ? 'alert' : 'on'
    }));

    grid.appendChild(tile({

    }));

    var m = c.morale;
    var lvl = m >= 1 ? 4 : m === 0 ? 3 : m >= -2 ? 2 : 1;

    grid.appendChild(tile({
      key:'morale', label:'Morale',
      value: lvl === 4 ? 'Strong' : lvl === 3 ? 'Holding' : lvl === 2 ? 'Strained' : 'Low',
      custom: bars, tone: lvl >= 3 ? 'on' : lvl === 2 ? 'warn' : 'alert'
    }));

    grid.appendChild(tile({
      key:'shelter', label:'Shelter', value: c.shelter ? 'Built' : 'None',
      icon:'i-tent', tone: c.shelter ? 'on' : 'off'
    }));
    grid.appendChild(tile({
      key:'signal', label:'Signal', value: c.signal ? 'Ponchos up' : 'None',
      icon:'i-flag', tone: c.signal ? 'on' : 'off'
    }));
    grid.appendChild(tile({
      key:'fire', label:'Fire', value: c.fire ? 'Burning' : 'None',
      icon:'i-flame', tone: c.fire ? 'on' : 'off'

    wrap.appendChild(grid);

  function breadcrumbBlock(){
    if (!state.trail.length) return null;
    var wrap = el('nav','breadcrumb');
    wrap.setAttribute('aria-label','Decisions so far');

  /* =========================================================================
     SCREEN: STOP
     ====================================================================== */
  function stopSign(){
    var svg = sv('svg', { class:'stop-sign', viewBox:'0 0 200 200', role:'img' });
    svg.appendChild(sv('title', {})).textContent = 'A red octagonal stop sign reading STOP';
    var pts = [];
    for (var i = 0; i < 8; i++){
      var a = (Math.PI / 4) * i + Math.PI / 8;
      pts.push((100 + 96 * Math.cos(a)).toFixed(1) + ',' + (100 + 96 * Math.sin(a)).toFixed(1));
    }
    svg.appendChild(sv('polygon', { points:pts.join(' '), fill:'#C4231B' }));
    var inner = [];
    for (var j = 0; j < 8; j++){
      var b = (Math.PI / 4) * j + Math.PI / 8;
      inner.push((100 + 82 * Math.cos(b)).toFixed(1) + ',' + (100 + 82 * Math.sin(b)).toFixed(1));
    }
    svg.appendChild(sv('polygon', { points:inner.join(' '), fill:'none', stroke:'#fff', 'stroke-width':7 }));
    var t = sv('text', { x:100, y:118, 'text-anchor':'middle',
      fill:'#fff', 'font-family':'var(--display)', 'font-size':'46',
      textLength:'116', lengthAdjust:'spacingAndGlyphs' });
    t.textContent = 'STOP';
    svg.appendChild(t);
    return svg;
  }

  function renderStop(){
    stage.innerHTML = '';
    var card = el('section','card scene');

    card.appendChild(el('p','kicker','Before you decide anything'));
    card.appendChild(el('h1', null, "It's important to remain calm and STOP."));

    var hero = el('div','stop-hero');

    var left = el('div','sign-wrap');
    left.appendChild(stopSign());
    left.appendChild(el('p','sign-caption',"Treat it like the sign. You don't roll through it. You come to a full stop first."));
    hero.appendChild(left);

    var right = el('div');
    var art = artBlock({ slot:'stop-hero', note:'Patrol halted mid-stride in the woods, one Scout raising a hand to stop the others' });
    if (art) right.appendChild(art);
    right.appendChild(el('p', null,
      'Many people panic at the first signs that something has gone wrong. Frantic decisions often lead down disastrous paths. ' +
      "It's important to remain calm and STOP (Stop, Think, Observe and Plan)."));
    hero.appendChild(right);

    card.appendChild(hero);

    var ul = el('ul','stop-steps');
    STOP_STEPS.forEach(function(s){
      var li = el('li','stop-step');
      li.appendChild(el('span','glyph', s.letter));
      var txt = el('div');
      txt.appendChild(el('strong','word', s.word));
      txt.appendChild(el('span','say', s.text));

      ul.appendChild(li);
    });
    card.appendChild(ul);

    card.appendChild(el('p','pick-line','Pick a path to help these Scouts find safety.'));

    var go = el('button','btn btn-primary','Pick a path');
    go.type = 'button';
    go.addEventListener('click', function(){
      state = freshState(); undoStack = []; render();
    });

    stage.appendChild(card);

  /* =========================================================================
     SCREEN: STORY / ENDING
     ====================================================================== */
  function render(){
    var node = STORY[state.node];
    stage.innerHTML = '';
    selectedPin = null;

    var bc = breadcrumbBlock();
    if (bc) stage.appendChild(bc);
    stage.appendChild(statusPanel());

    var card = el('section','card scene');

    if (node.ending){
      var tone = node.ending;
      var badge = el('div','outcome-badge ' + tone);
      badge.appendChild(icon(tone === 'bad' ? 'i-x' : 'i-check'));
      badge.appendChild(document.createTextNode(
        tone === 'good' ? 'Everyone gets home' : tone === 'rough' ? 'You make it — the hard way' : 'This goes wrong'));
      card.appendChild(badge);

      var note = el('p','light-note');
      note.appendChild(icon('i-clock'));
      note.appendChild(document.createTextNode(state.daylight > 0
        ? 'You still had ' + formatTime(state.daylight) + ' of daylight when you stopped moving and started working.'
        : 'The light was already gone by the time you stopped moving.'));
      card.appendChild(note);
    } else if (node.kicker){
      card.appendChild(el('p','kicker', node.kicker));
    }

    if (node.consequence){
      var cq = el('div','consequence' + (node.consequenceTone === 'neutral' ? ' neutral' : ''));
      cq.appendChild(el('p','kicker','What just happened'));
      cq.appendChild(el('p', null, node.consequence));
      card.appendChild(cq);
    }

    card.appendChild(el('h2', null, node.title));

    var art = artBlock(node.art);
    if (art) card.appendChild(art);

    card.appendChild(paragraphs(node.text));

    if (node.choices && node.choices.length){
      card.appendChild(el('p','prompt', node.prompt || 'What do you do?'));
      var list = el('div','choices');
      node.choices.forEach(function(ch, i){
        var b = el('button','choice');
        b.type = 'button';
        b.appendChild(el('span','key', LETTERS[i]));
        var txt = el('span');
        txt.appendChild(document.createTextNode(ch.label));
        if (ch.time){
          var cost = el('span','cost');
          cost.appendChild(icon('i-clock'));
          cost.appendChild(document.createTextNode('About ' + formatTime(ch.time) + ' of daylight'));
          txt.appendChild(cost);
        }
        b.appendChild(txt);
        b.addEventListener('click', function(){ applyChoice(ch); render(); });
        list.appendChild(b);
      });
      card.appendChild(list);
    }

    if (node.caption){
      var tip = el('div','tip');
      var k = el('p','kicker');
      k.appendChild(icon('i-bulb'));
      k.appendChild(document.createTextNode(node.ending ? 'Survival tip' : 'Remember this'));
      tip.appendChild(k);
      tip.appendChild(el('p', null, node.caption));
      card.appendChild(tip);
    }

    if (node.facilitator && node.facilitator.length){
      var f = el('div','facilitator');
      f.appendChild(el('p','kicker','Talk it over'));
      var ul = el('ul');
      node.facilitator.forEach(function(q){ ul.appendChild(el('li', null, q)); });
      f.appendChild(ul);
      card.appendChild(f);
    }

    stage.appendChild(card);
    if (node.ending) stage.appendChild(mapCard());
    stage.appendChild(controlsBlock(!!node.ending));
    afterPaint(card.querySelector('.choice') || card);
  }

  function controlsBlock(isEnding){
    var wrap = el('div','controls');
    if (undoStack.length){
      var back = el('button','btn btn-ghost', isEnding ? 'Back up one decision and try again' : 'Back up one decision');
      back.type = 'button';
      back.addEventListener('click', function(){ restore(undoStack.pop()); render(); });
      wrap.appendChild(back);
    }
    var again = el('button','btn ' + (isEnding ? 'btn-primary' : 'btn-ghost'), 'Start over');
    again.type = 'button';
    again.addEventListener('click', function(){ undoStack = []; renderStop(); });
    wrap.appendChild(again);
    return wrap;
  }

  /* =========================================================================
     TRAIL MAP
     ====================================================================== */
  var MAP_W = 1060, MAP_H = 700;
  var COL_X = [95, 300, 520, 700];
  var ROW_TOP = 116, ROW_H = 56;

  function mapLayout(){
    var pos = {}, leafN = 0;
    (function assign(id){
      var n = STORY[id];
      if (!n.choices){ pos[id] = { row:leafN++ }; return; }
      n.choices.forEach(function(c){ assign(c.to); });
      var rows = n.choices.map(function(c){ return pos[c.to].row; });
      pos[id] = { row: rows.reduce(function(a,b){ return a+b; }, 0) / rows.length };
    })(ROOT);

    Object.keys(pos).forEach(function(id){
      var jitter = ((id.length * 37 + id.charCodeAt(0) * 11) % 17) - 8;
      pos[id].x = COL_X[DEPTH[id]];
      pos[id].y = ROW_TOP + pos[id].row * ROW_H + jitter * 0.7;
    });
    return pos;
  }

  function treeGlyph(x, y, s, dark){
    var g = sv('g');
    g.appendChild(sv('rect', { x:x-1.4*s, y:y, width:2.8*s, height:4.5*s, rx:1, class:'terrain-trunk' }));
    g.appendChild(sv('path', {
      d:'M'+x+' '+(y-16*s)+' L'+(x+9*s)+' '+(y-2*s)+' L'+(x-9*s)+' '+(y-2*s)+' Z',
      class:'terrain-tree' + (dark ? ' dark' : '')
    }));
    g.appendChild(sv('path', {
      d:'M'+x+' '+(y-22*s)+' L'+(x+7*s)+' '+(y-10*s)+' L'+(x-7*s)+' '+(y-10*s)+' Z',
      class:'terrain-tree' + (dark ? ' dark' : '')
    }));
    return g;
  }

  /* Keep-out geometry so the forest never grows on top of the trail,
     the pins, the labels or the map furniture. */
  function collides(x, y, keep){
    for (var i = 0; i < keep.circles.length; i++){
      var c = keep.circles[i];
      if ((x-c.x)*(x-c.x) + (y-c.y)*(y-c.y) < c.r*c.r) return true;
    }
    for (var j = 0; j < keep.rects.length; j++){
      var r = keep.rects[j];
      if (x > r.x0 && x < r.x1 && y > r.y0 && y < r.y1) return true;
    }
    return false;
  }

  function textKeepOut(keep, x, y, str, anchor, size){
    var w = str.length * (size || 8.4);
    var x0 = anchor === 'middle' ? x - w/2 : x;
    for (var t = 0; t <= w + 8; t += 13) keep.circles.push({ x:x0 + t, y:y - 5, r:19 });
  }

  function bezierKeepOut(keep, a, b){
    var mx = (a.x + b.x) / 2;
    for (var i = 0; i <= 22; i++){
      var t = i / 22, u = 1 - t;
      var x = u*u*u*a.x + 3*u*u*t*mx + 3*u*t*t*mx + t*t*t*b.x;
      var y = u*u*u*a.y + 3*u*u*t*a.y + 3*u*t*t*b.y + t*t*t*b.y;
      keep.circles.push({ x:x, y:y, r:27 });
    }
  }

  function forestLayer(keep){
    var g = sv('g', { 'aria-hidden':'true' });
    var step = 58, n = 0;
    for (var gx = 24; gx < MAP_W - 10; gx += step){
      for (var gy = 40; gy < MAP_H - 14; gy += step){
        n++;
        var h = (n * 2654435761) % 1000;                 // deterministic pseudo-random
        if (h % 100 < 34) continue;                      // thin the grid out
        var x = gx + ((h % 37) - 18);
        var y = gy + ((h % 29) - 14);
        if (x < 16 || x > MAP_W - 16 || y < 34 || y > MAP_H - 10) continue;
        // test the trunk and the canopy above it, so branches never cover a label
        if (collides(x, y, keep) || collides(x, y - 16, keep)) continue;
        g.appendChild(treeGlyph(x, y, 0.72 + (h % 45) / 100, h % 2));
      }
    }
    return g;
  }

  function terrainLayer(pos, keep){
    var g = sv('g', { 'aria-hidden':'true' });

    g.appendChild(sv('rect', { x:0, y:0, width:MAP_W, height:MAP_H, fill:'#F3EAD5' }));
    g.appendChild(sv('path', {
      d:'M0 '+MAP_H+' V596 q170 -44 340 -16 t330 -6 390 -34 V'+MAP_H+' Z', fill:'#EADFC2' }));

    // distant ridge line across the top
    g.appendChild(sv('path', {
      d:'M-10 98 L64 54 L136 84 L214 36 L296 78 L368 46 L446 88 L524 40 L602 82 ' +
        'L682 26 L762 76 L842 32 L920 80 L1000 42 L1070 86 L1070 -10 L-10 -10 Z',
      class:'ridge' }));
    g.appendChild(sv('path', { d:'M682 26 L720 62 L644 62 Z M842 32 L878 66 L806 66 Z M214 36 L250 70 L178 70 Z', class:'ridge-2' }));

    // the river runs through the river-crossing pin, then out of frame
    var rp = pos['p1b'] || { x:520, y:172 };
    var d = 'M-12 ' + (rp.y - 46) + ' q140 -30 268 10 T' + rp.x + ' ' + rp.y +
            ' q130 28 240 -12 T' + (MAP_W + 40) + ' ' + (rp.y - 26);
    g.appendChild(sv('path', { d:d, class:'river' }));
    g.appendChild(sv('path', { d:d, class:'river-2' }));

    return g;
  }

  function furnitureLayer(){
    var g = sv('g', { 'aria-hidden':'true' });

    // title block
    g.appendChild(sv('rect', { x:34, y:18, width:436, height:60, rx:12,
      fill:'rgba(255,253,247,.82)', stroke:'#CFC0A0', 'stroke-width':2 }));
    g.appendChild(svText(52, 46, 'THE WOODS', 'map-title'));
    g.appendChild(svText(54, 66, 'EVERY PATH YOU COULD HAVE TAKEN', 'map-sub'));

    // compass, lower right
    var cx = 982, cy = 626;
    g.appendChild(sv('circle', { cx:cx, cy:cy, r:30, fill:'rgba(255,253,247,.86)',
      stroke:'#BCA98A', 'stroke-width':2 }));
    g.appendChild(sv('path', { d:'M'+cx+' '+(cy-22)+' L'+(cx+8)+' '+cy+' L'+cx+' '+(cy-6)+' L'+(cx-8)+' '+cy+' Z', fill:'#C4231B' }));
    g.appendChild(sv('path', { d:'M'+cx+' '+(cy+22)+' L'+(cx-8)+' '+cy+' L'+cx+' '+(cy+6)+' L'+(cx+8)+' '+cy+' Z', fill:'#8C7B58' }));
    g.appendChild(svText(cx, cy - 34, 'N', 'legend-txt', 'middle'));

    // legend strip along the bottom
    var y = 668;
    g.appendChild(sv('rect', { x:34, y:y-28, width:706, height:52, rx:12,
      fill:'rgba(255,253,247,.9)', stroke:'#BCA98A', 'stroke-width':2 }));
    g.appendChild(sv('path', { d:'M50 '+y+' h44', stroke:'#F2A93B', 'stroke-width':7, 'stroke-linecap':'round' }));
    g.appendChild(svText(104, y+5, 'the route you took', 'legend-txt'));
    g.appendChild(sv('path', { d:'M254 '+y+' h44', stroke:'#B7A98B', 'stroke-width':3,
      'stroke-dasharray':'2 7', 'stroke-linecap':'round' }));
    g.appendChild(svText(308, y+5, 'paths not taken', 'legend-txt'));
    [['#4C8A5B','safe',452],['#F2A93B','rough',532],['#E8552A','goes wrong',616]].forEach(function(it){
      g.appendChild(sv('circle', { cx:it[2], cy:y-4, r:9, fill:it[0], stroke:'#fff', 'stroke-width':2.5 }));
      g.appendChild(svText(it[2]+14, y+1, it[1], 'legend-txt'));
    });
    return g;
  }

  function wrapWords(str, max){
    var words = String(str).split(' '), lines = [], cur = '';
    words.forEach(function(w){
      if (!cur.length) cur = w;
      else if ((cur + ' ' + w).length <= max) cur += ' ' + w;
      else { lines.push(cur); cur = w; }
    });
    if (cur.length) lines.push(cur);
    return lines.slice(0, 2);
  }

  function endingColor(kind){
    return kind === 'good' ? '#4C8A5B' : kind === 'rough' ? '#F2A93B' : '#E8552A';
  }

  function mapCard(){
    var card = el('section','card map-card');
    card.appendChild(el('p','kicker','The whole trail map'));
    card.appendChild(el('h2', null, 'Where every choice led'));
    card.appendChild(el('p','map-intro',
      'Now that you are out of the woods, here is the country you were walking through. Your route is the gold trail. Everything faint is a path you did not take.'));

    var frame = el('div','map-frame');
    if (MAP_BACKGROUND){
      var bg = document.createElement('img');
      bg.className = 'map-bg'; bg.src = MAP_BACKGROUND; bg.alt = '';
      frame.appendChild(bg);
    }

    var svg = sv('svg', { class:'map-svg', viewBox:'0 0 ' + MAP_W + ' ' + MAP_H, role:'group' });
    svg.setAttribute('aria-label','Trail map of every decision path in the scenario');

    var pos = mapLayout();

    var stepNo = 0, numbers = {};
    (function number(id){
      if (!STORY[id].ending) numbers[id] = ++stepNo;
      (STORY[id].choices || []).forEach(function(c){ number(c.to); });
    })(ROOT);

    /* ---- measure everything before drawing, so the forest can dodge it ---- */
    var keep = { circles:[], rects:[] };
    var labels = [];
    var ids = Object.keys(STORY);

    ids.forEach(function(id){
      var n = STORY[id], p = pos[id], isEnd = !!n.ending;
      var r = isEnd ? 15 : 17;
      keep.circles.push({ x:p.x, y:p.y, r:r + 22 });

      var lines = wrapWords(n.pinLabel, isEnd ? 16 : 17);
      lines.forEach(function(ln, i){
        var anchor = isEnd ? 'start' : 'middle';
        var tx = isEnd ? p.x + r + 11 : p.x;
        var ty = isEnd ? p.y + 5 - (lines.length - 1) * 8 + i * 17 : p.y + r + 19 + i * 16;
        labels.push({ id:id, x:tx, y:ty, str:ln, anchor:anchor });
        textKeepOut(keep, tx, ty, ln, anchor, 8.4);
      });
    });

    ids.forEach(function(id){
      (STORY[id].choices || []).forEach(function(c){ bezierKeepOut(keep, pos[id], pos[c.to]); });
    });

    keep.rects.push({ x0:20, y0:6, x1:486, y1:92 });        // title block
    keep.rects.push({ x0:20, y0:626, x1:756, y1:MAP_H });   // legend strip
    keep.rects.push({ x0:938, y0:582, x1:1032, y1:674 });   // compass
    keep.rects.push({ x0:0, y0:0, x1:MAP_W, y1:102 });      // ridge

    /* ---- draw ---- */
    if (!MAP_BACKGROUND){
      svg.appendChild(terrainLayer(pos, keep));
      svg.appendChild(forestLayer(keep));
    }

    var edges = sv('g');
    ids.forEach(function(id){
      (STORY[id].choices || []).forEach(function(c){
        var a = pos[id], b = pos[c.to];
        var taken = state.visited.indexOf(id) !== -1 && state.visited.indexOf(c.to) !== -1;
        var mx = (a.x + b.x) / 2;
        edges.appendChild(sv('path', {
          d:'M' + a.x + ' ' + a.y + ' C ' + mx + ' ' + a.y + ', ' + mx + ' ' + b.y + ', ' + b.x + ' ' + b.y,
          class:'edge' + (taken ? ' taken' : '')
        }));
      });
    });
    svg.appendChild(edges);

    if (!MAP_BACKGROUND) svg.appendChild(furnitureLayer());

    var labelLayer = sv('g', { 'aria-hidden':'true' });
    labels.forEach(function(L){
      var taken = state.visited.indexOf(L.id) !== -1;
      var halo = svText(L.x, L.y, L.str, 'pin-label', L.anchor);
      halo.setAttribute('stroke', '#F6EEDC');
      halo.setAttribute('stroke-width', '4.5');
      halo.setAttribute('stroke-linejoin', 'round');
      labelLayer.appendChild(halo);
      labelLayer.appendChild(svText(L.x, L.y, L.str, 'pin-label' + (taken ? ' taken' : ''), L.anchor));
    });
    svg.appendChild(labelLayer);

    var pins = sv('g');
    ids.forEach(function(id){
      var n = STORY[id], p = pos[id];
      var taken = state.visited.indexOf(id) !== -1;
      var isEnd = !!n.ending;
      var g = sv('g', { class:'pin' + (taken ? ' taken' : ''), tabindex:'0', role:'button' });
      g.setAttribute('data-node', id);
      g.setAttribute('aria-label', (isEnd ? 'Ending: ' : 'Decision point: ') + n.pinLabel +
        (taken ? ' — on your route' : ''));

      var r = isEnd ? 15 : 17;
      g.appendChild(sv('circle', { class:'halo', cx:p.x, cy:p.y, r:r + 6 }));
      g.appendChild(sv('circle', {
        class:'body-shape', cx:p.x, cy:p.y, r:r,
        fill: isEnd ? endingColor(n.ending) : (id === ROOT ? '#12706F' : '#1F9C9C')
      }));

      if (isEnd){
        var mk = n.ending === 'bad'
          ? 'M' + (p.x-5) + ' ' + (p.y-5) + ' l10 10 M' + (p.x+5) + ' ' + (p.y-5) + ' l-10 10'
          : 'M' + (p.x-5.5) + ' ' + p.y + ' l4 4.5 l7.5 -8.5';
        g.appendChild(sv('path', { d:mk, fill:'none', stroke:'#fff', 'stroke-width':3,
          'stroke-linecap':'round', 'stroke-linejoin':'round' }));
      } else {
        g.appendChild(svText(p.x, p.y, String(numbers[id]), 'num', 'middle'));
      }

      g.appendChild(sv('circle', { class:'hit', cx:p.x, cy:p.y, r:r + 9 }));

      function show(lock){ selectPin(id, lock); }
      g.addEventListener('mouseenter', function(){ show(false); });
      g.addEventListener('focus', function(){ show(false); });
      g.addEventListener('click', function(){ show(true); });
      g.addEventListener('keydown', function(e){
        if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); show(true); }
      });
      pins.appendChild(g);
    });
    svg.appendChild(pins);

    frame.appendChild(svg);
    card.appendChild(frame);

    var hint = el('p','map-hint');
    hint.appendChild(icon('i-tap'));
    hint.appendChild(document.createTextNode('Hover or tap any marker to read what happened there — and jump back in to try it.'));
    card.appendChild(hint);

    var detail = el('div','map-detail');
    detail.id = 'mapDetail';
    detail.appendChild(el('p','md-empty','Pick a marker on the map. There are ten endings in here; you have seen one.'));
    card.appendChild(detail);

    return card;
  }

  function selectPin(id, lock){
    if (selectedPin && !lock && selectedPin.locked) return;
    selectedPin = { id:id, locked:!!lock };

    var svgRoot = document.querySelector('.map-svg');
    if (svgRoot){
      Array.prototype.forEach.call(svgRoot.querySelectorAll('.pin'), function(p){
        p.classList.toggle('active', p.getAttribute('data-node') === id);
      });
    }

    var n = STORY[id];
    var box = document.getElementById('mapDetail');
    if (!box) return;
    box.innerHTML = '';

    var head = el('div','md-head');
    var tag = el('span','md-tag ' + (n.ending || 'step'),
      n.ending === 'good' ? 'Safe' : n.ending === 'rough' ? 'Safe, the hard way' :
      n.ending === 'bad' ? 'Goes wrong' : 'Decision point');
    head.appendChild(tag);
    if (state.visited.indexOf(id) !== -1) head.appendChild(el('span','md-tag yours','On your route'));
    box.appendChild(head);

    box.appendChild(el('h3', null, n.ending ? n.title : n.mapLabel));
    box.appendChild(el('p','md-lesson', n.caption || (n.consequence || n.text[0])));

    var target = n.ending ? (PARENT[id] ? PARENT[id].id : ROOT) : id;
    if (target !== state.node || !n.ending){
      var jump = el('button','btn btn-ghost btn-sm',
        n.ending ? 'Replay the decision that led here' : 'Play from this point');
      jump.type = 'button';
      jump.addEventListener('click', function(){
        if (target === ROOT){ state = freshState(); undoStack = []; }
        else playTo(target);
        render();
      });
      box.appendChild(jump);
    }
    postHeight();
  }

  /* =========================================================================
     MEETING MODE / IFRAME HEIGHT / KEYBOARD
     ====================================================================== */
  var toggle = document.getElementById('modeToggle');
  toggle.addEventListener('click', function(){
    var on = document.body.classList.toggle('meeting');
    toggle.setAttribute('aria-pressed', on ? 'true' : 'false');
    postHeight();
  });

  function postHeight(){
    var h = Math.max(document.documentElement.scrollHeight,
                     document.body ? document.body.scrollHeight : 0);
    try { parent.postMessage({ type:'lostPatrolHeight', height:h }, '*'); } catch(e){}
  }

  function afterPaint(focusTarget){
    if (focusTarget && focusTarget.focus){
      try { focusTarget.focus({ preventScroll:true }); } catch(e){ focusTarget.focus(); }
    }
    postHeight();
    window.setTimeout(postHeight, 400);
  }

  if (window.ResizeObserver) new ResizeObserver(postHeight).observe(document.documentElement);
  else window.addEventListener('resize', postHeight);

  document.addEventListener('keydown', function(e){
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var btns = stage.querySelectorAll('.choice');
    if (!btns.length) return;
    var k = e.key.toUpperCase();
    var idx = LETTERS.indexOf(k);
    if (idx === -1 && /^[1-4]$/.test(k)) idx = parseInt(k, 10) - 1;
    if (idx > -1 && btns[idx]){ e.preventDefault(); btns[idx].click(); }
  });

  renderStop();
})();
</script>
</body>
</html>
